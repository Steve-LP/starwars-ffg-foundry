<form class="{{cssClass}} specialization-sheet-container" autocomplete="off">
  <header class="sheet-header">
    <img class="profile-img" src="{{item.img}}" data-edit="img" title="{{item.name}}" />
    <div class="header-details">
      <h1><input name="name" type="text" value="{{item.name}}" placeholder="Specialization Name" /></h1>
      <div class="item-type-tag">Specialization</div>
    </div>
  </header>

  <hr />

  <section class="sheet-body">
    <div class="specialization-sheet-tree">
      <div class="career-skills-info">
        <label>Career Skills:</label>
        <input type="text" name="system.careerSkills" value="{{system.careerSkills}}" placeholder="e.g. Charm, Deception, Knowledge (Outer Rim)" />
      </div>

      {{#if isEmbedded}}
      <div class="xp-hud-bar">
        <span>Available XP: <strong>{{availableXp}} XP</strong></span>
      </div>
      {{/if}}

      {{> "systems/starwars-ffg-scratch/templates/parts/talent-grid.hbs"}}
    </div>
  </section>
</form>
